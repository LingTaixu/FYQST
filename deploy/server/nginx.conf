map $http_upgrade $fyqst_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=fyqst_login:1m rate=6r/m;
server {
    listen 80;
    server_name __PUBLIC_HOST__;
    root /srv/fyqst/.local/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 128k;
    access_log /var/log/nginx/fyqst-access.log combined;
    error_log /var/log/nginx/fyqst-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types application/javascript application/json text/css text/plain application/xml image/svg+xml;

    location ~* \.(mp3|ogg|oga|wav|m4a|aac|flac|opus|weba)(/|$) {
        access_log off;
        add_header X-Audio-Policy disabled always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        return 204;
    }
    location = /vp000 { return 302 /vp000/; }
    location ^~ /vp000/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 45s;
    }
    location ^~ /_api/login/ {
        if ($arg_r !~ "^(c|h)[.]") { return 403; }
        proxy_pass http://127.0.0.1:9901/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
    location ^~ /_api/game/ {
        # The gateway only exposes player routes. Admin/remote routes stay internal.
        if ($arg_r ~* "^(admin|h|remote)[.]") { return 403; }
        proxy_pass http://127.0.0.1:20001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
    location ^~ /_version/ {
        proxy_pass http://127.0.0.1:9902/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
    location ^~ /_socket/city/ {
        proxy_pass http://127.0.0.1:10001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fyqst_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /_socket/battle/ {
        proxy_pass http://127.0.0.1:9001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fyqst_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location = /game.php {
        limit_req zone=fyqst_login burst=6 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/fyqst/deploy/server/login.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/fyqst.sock;
        fastcgi_hide_header X-Powered-By;
        add_header Cache-Control no-store always;
    }
    location = /daily.php {
        limit_req zone=fyqst_login burst=10 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/fyqst/deploy/server/daily.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/fyqst.sock;
        fastcgi_hide_header X-Powered-By;
        add_header Cache-Control no-store always;
    }
    # 游戏入口与每日奖励脚本必须每次回源，避免玩家停留在旧界面。
    location = /game.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /js/daily-reward.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    # Public PHP is limited to the login bridge. Operations use the new Bun API.
    location ~* \.(php|inc|sql|ini|log|key|pem|gz|br|env|txt|zip|tar|bak)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(js|css|json|png|jpg|jpeg|webp|gif|svg|ico|fnt|ttf|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
}
