# Include inside the site's server {} block, before other regex locations.
# The WSL PHP development server applies the same policy in scripts/router.php.
location ~* \.(mp3|ogg|oga|wav|m4a|aac|flac|opus|weba)(/|$) {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Audio-Policy "disabled" always;
    return 204;
}
