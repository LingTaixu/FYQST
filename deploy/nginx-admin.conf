# Include inside the site's server {} block alongside nginx-bandwidth.conf.
# The Bun process serves Vite output and APIs, and denies all old PHP routes.
location = /vp000 {
    return 302 /vp000/;
}
location ^~ /vp000/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 128k;
    proxy_read_timeout 45s;
}
