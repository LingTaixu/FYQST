    #txtLoading {

    .div_refresh {
        position: absolute;

    .div_refresh span {

    .div_refresh a {
        color: rgb(222, 150, 72);

    .bg {

        background: url(resource/ui2/ui_bg/webtile.jpg)no-repeat;

    .bg2 {

    }

    .bg-left {
        position: absolute;
        transform: rotate(180deg);
        left: 0;

    }

    .bg-right {
        position: absolute;;
        right: 0;
        top: 0;
    }

    .bg.bg-top {
        transform-origin: 50% 50%;
        transform: rotate(180deg);
    }

    .bg.bg-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
    }

    .loading-progress-text {
        padding: 0;
        margin: 0;
        text-align: center;
        font-size: 18px;
    }

    #loadingText {
        color: black;
        font-size: 0.85em;
    }

               canvas{
            background: url(resource/ui2/ui_bg/bg_forge.jpg)no-repeat top/cover;

<body>
    <div class="h5c-loading" id='loadingUi' style='z-index:2;'>
        <div class="whitebg"></div>
        <div class="loading-bg">
            <div class="h5-loading-container" style="display: block;">
                <div class="loading-progress">
                    <div class="loading-progress-bar">

    <div id="gameMainDiv" style="margin: auto;width: 100%;height: 100%;" class="egret-player " data-entry-class="Main" data-orientation="auto" data-scale-mode="showAll" data-resolution-mode="retina" data-frame-rate="30" data-content-width="480" data-content-height="800" data-show-paint-rect="false" data-multi-fingered="2" data-show-fps="false" data-show-log="false" data-log-filter="" data-show-fps-style="x:0,y:0,size:30,textColor:0x00c200,bgAlpha:0.9">

    <script>
    (function() {
        var channel = {
            id: 10006,
            root_url: 'http://127.0.0.1:9902/manifest',
            bi_url: 'http://127.0.0.1:9902/bi',
            log_url: 'http://127.0.0.1:9902/log',
            guidelog_url: 'http://127.0.0.1:9902/guidelog'
        };
        window.channel = channel;
        window.bi_url = channel.bi_url;
        var root_url = channel.root_url;
        //BI  login 登录index
        var xmlArray = {
            1: { val: 0, kingdom: "login", family: "登录index" },
            2: { val: 1, kingdom: "start", family: "开始加载" },
            3: { val: 2, kingdom: "load_picture", family: "加载资源" },
            4: { val: 3, kingdom: "welcome", family: "进入游戏" },
        };
        window.setCheckPoint = function(step, clientid, accountId, user_level) {

            if(step > 4){
                return;
            }

            var xhr = new XMLHttpRequest();
            var xmlDate = xmlArray[step];
            if(!xmlDate) return;
            clientid = clientid || 0;
            accountId = 0;
            if (window.gd &&gd.accountCtrl) {
                accountId = gd.accountCtrl.getAccountName();
            }
            var userId = 0;
            user_level = 0;
            if (window.gd &&gd.userCtrl) {
                userId = gd.userCtrl.getId();
                user_level = gd.userCtrl.getLvl();
            }
            var url = window.bi_url +
                "?clientid=" +
                clientid +
                "&accountId=" +
                accountId +
                "&userId=" +
                userId +
                "&user_level=" +
                user_level +
                "&value=" +
                xmlDate.val +
                "&kingdom=" +
                xmlDate.kingdom +
                "&family=" +
                xmlDate.family +
                "&serverId=" +
                (window.mo ? window.mo.getLocalStorageItem("lastLoginServerId") : 0) +
                "&channelId=" +
                channel.id;
            if (window.ZmSdk) {
                var tmpUserInfo = window.ZmSdk.getInstance().getUserInfo();
                var sdkData = {
                    common: tmpUserInfo.common,
                    userdata: {}
                };
                sdkData.userdata.uid = tmpUserInfo.userdata.uid;
                sdkData.userdata.t = tmpUserInfo.userdata.t;
                sdkData.userdata.sign = tmpUserInfo.userdata.sign;
                url += "&userInfo=" + JSON.stringify(sdkData);
            }
            xhr.open('GET', url, true);
            xhr.send(null);
        };

        var loadingUi;
        var lbar;
        var loadingInterID;
        var progressInterID;
        var loadpercent;
        var loadFlag;
        var project = {};
        
        //zm sdk callback
        window.zmInitSucc = function() {
		                    loadingUi = document.getElementById('loadingUi');
                    lbar = document.getElementById('loadingBar');
                    loadpercent = 0;
                    loadFlag = false;
		loadCodeAndRes();
        };

        //设置顶部和底部空白部分的背景
        function resizeBg() {
            var w_width = $(window).width();
            var w_height = $(window).height();
            var w_rate = w_width / w_height;
            // $(".bg").hide();
            if (w_rate >= 0.6) {
                $(".bg").hide();
                $(".h5c-loading .loading-bg").height("100%");
                $(".h5c-loading .loading-bg").width(0.6 * w_height);
                $(".h5c-loading .loading-bg").css("left", (w_width - 0.6 * w_height) / 2);
                $(".h5c-loading .whitebg").height("100%");

                $(".bg2").show();
                var bg2_width = (w_width - w_height * 0.6) / 2;
                $(".bg2").width(bg2_width);

                if(bg2_width <= 100) {
                    $('.bg2').css("background-size","auto 100%")
                }else {
                    $('.bg2').css("background-size","100% 100%")
                }

            } else {
                var bg_height = (w_height - w_width / 0.6) / 2;
                $(".bg").height(bg_height);
                $(".bg").show();
                $(".h5c-loading .loading-bg").width("100%");
                $(".h5c-loading .loading-bg").height(w_width / 0.6);
                $(".h5c-loading .loading-bg").css("top", bg_height);
                $(".h5c-loading .whitebg").height(w_width / 0.6);
                $(".h5c-loading .whitebg").css("top", bg_height);

                $(".bg2").hide();
            }
        }
        $(window).resize(function() {
            resizeBg();
        })
        // no channel callback
        window.onload = function() {
            resizeBg();
            $(".bg").hide();
            window.platform = "egret";
            showFakeBar();
        };
        var barNumsArr = [18, 54];
        var barAnimeInterval;
        function finishFakeBar() {
            var barP = document.getElementById('loadingText');
            var barShow = document.getElementById('loadingBar');

            if (barAnimeInterval) {
                clearInterval(barAnimeInterval);
                barAnimeInterval = null;
            }

            barShow.style.width = 100 + "%";
            barP.innerText = "加载中... [" + barNumsArr[1] + "/" + barNumsArr[1] + "]";
        }

        function showFakeBar() {
            var barP = document.getElementById('loadingText');
            var barShow = document.getElementById('loadingBar');

            var barIndex = 0;
            var tempStart = 0;

            barAnimeInterval = setInterval(function() {
                var addRand = Math.ceil(Math.random() * 3);

                tempStart += addRand;

                var nextWidth = 0;

                if (tempStart >= barNumsArr[barIndex] && barIndex == 0) {
                    tempStart = 0;
                    barIndex = 1;
                    nextWidth = 0;
                } else {
                    if (barIndex == 0) {
                        tempStart = tempStart >= barNumsArr[barIndex] ? barNumsArr[barIndex] : tempStart;
                        nextWidth = tempStart / barNumsArr[barIndex] * 100;
                    } else {
                        tempStart = tempStart >= barNumsArr[barIndex] ? barNumsArr[barIndex] - 2 : tempStart;
                        nextWidth = tempStart / barNumsArr[barIndex] * 100;
                    }
                }

                barShow.style.width = nextWidth + "%";
                barP.innerText = "加载中... [" + tempStart + "/" + barNumsArr[barIndex] + "]";

                if (tempStart >= (barNumsArr[barIndex] - 3) && barIndex == 1) {
                    clearInterval(barAnimeInterval);
                    barAnimeInterval = null;
                }

            }, 400);
        }

        function loadScript(list, callback) {
            var loaded = 0;
            var loadNext = function() {
                loadSingleScript(list[loaded], function() {
                    loaded++;
                    if (loaded >= list.length) {
                        callback();
                    } else {
                        loadNext();
                    }
                });
            };
            loadNext();
        }

        function loadSingleScript(src, callback) {
            var s = document.createElement('script');
            s.async = true;
            var after = project.resRefreshs[(src)];
            if (after) {
                src += '?v=' + after;
            }
            s.src = src;
            s.addEventListener('load', function() {
                // s.parentNode.removeChild(s);
                s.removeEventListener('load', arguments.callee, false);
                callback && callback();
            }, false);
            document.body.appendChild(s);
        }

        window.stopLoadProgress = function() {
            finishFakeBar();

            clearInterval(loadingInterID);
            clearInterval(progressInterID);
            loadingUi.parentNode.removeChild(loadingUi);
            $('.bg').show();
            $('body').css("background", "#000000");
        };

        function loadCodeAndRes() {
            // updateTip();
            if (loadFlag) {
                return;
            }
            loadFlag = true;
            //BI  index
            setCheckPoint(1);
            var version = window.localStorage && window.localStorage.getItem('ver') || '1.0.0';
            $.getJSON(root_url + '?ver=' + version, function(manifest) {
                project = manifest.project;
                window.localStorage && window.localStorage.setItem('ver', project.version);
                // var list = manifest.module.concat(manifest.game);
                var list = manifest.game;
                if (!window.Worker) {
                    list = list.concat(["libs/modules/worker/socket.io.js", "libs/modules/worker/wsclient.inner.js"]);
                }

                //BI 开始加载
                setCheckPoint(2);

                loadScript(list, function() {
                    manifest.project.channelId = channel.id;
                    egret.project.config = manifest.project;
                    egret.project.version = manifest.project.version;
                    egret.project.channelId = channel.id;
                    egret.project.resRefreshs = manifest.project.resRefreshs || {};
                    egret.project.firstDownloads = manifest.project.firstDownloads || [];
                    egret.project.bi_url2 = channel.bi_url2;
                    egret.project.log_url = channel.log_url;

                    g_consts.TOP_BUTTON_DIR = 0;

                    var opt = ZmSdk.getInstance().getUserInfo();
                    if(opt.common.sdkindx == "10641"){
                        window.noVoice = true;
                    }
                    runGame();
                });
            }).fail(function(){
                // console.log('get manifest error');
                loadFlag=false;
                clearInterval(loadingInterID);
                setTimeout(function(){
                    loadCodeAndRes();
                },1000);
                
            });
        }


        function runGame() {
            window.FyqstAudioPolicy.install();
            
            var csf = 1;
            var lcsfIndex = window.localStorage && window.localStorage.getItem("performance2") * 1;
            lcsfIndex = lcsfIndex || 2;
            var pa = [.5, .5, .9, 1.2];
            csf = pa[lcsfIndex] * window.devicePixelRatio;
            egret.runEgret({
                renderMode: "webgl",
                antialias: false,
                audioType: 2,
                canvasScaleFactor: csf
            });
        }

        document.getElementById('a_refresh').onclick = function() {
            // mo.reload();
            location.reload();
        };
    })();
    </script>
    <script type="text/javascript" src="js/daily-reward.js?v=20261112-4"></script>
</body>
